[package]
name = "gpadview"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = [
    "Gaming_Input",
    "Foundation_Collections",
    "Win32_System_WinRT",
    "Foundation",
] }
image = "0.25.10"
hidapi = "2.6"
egui = "0.34.1"
eframe = { version = "0.34.1", features = ["persistence"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"